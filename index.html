<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="GS Quản lý" />
<title>GS.studio – Quản lý nội bộ</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="images/icon-192.png" />
<link rel="apple-touch-icon" href="images/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  CONFIG – MỌI CẤU HÌNH CỦA APP NẰM Ở ĐÂY                         ║
   ║  Sửa xong lưu file, tải lại trang là áp dụng.                    ║
   ║  Lưu ý: những gì đã chỉnh trong tab "Cài đặt" của app sẽ được    ║
   ║  ưu tiên hơn giá trị ở đây (vì được lưu cùng dữ liệu).           ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const CONFIG = {
  brand: "GS.studio",
  reportTo: "chị Ngọc Thảo",          // người nhận báo cáo
  managerName: "Vân Lam",              // tên hiện ở ô "Ghi chú của ..." trong báo cáo

  /* ---------- ĐỘI NGŨ ----------
     role: "manager" = Quản lý (toàn quyền) | "member" = Thành viên | "viewer" = Chỉ xem (Dashboard + Báo cáo)
     tags: vai trò chuyên môn, chọn nhiều trong: "Chụp", "Quay", "Retouch", "Điều phối"
     pinHash: mã PIN đã được mã hoá (KHÔNG ghi PIN thật vào đây).
       → Cách đổi PIN dễ nhất: đăng nhập tài khoản Quản lý → Cài đặt → Thành viên → "Đặt PIN mới". */
  team: [
    { id: "vanlam",   name: "Vân Lam",   role: "manager", tags: ["Điều phối", "Chụp"],  pinHash: "daee028db72c2e8c2d40e7cafc7caa2f2d80955372f5789fc075a1371099e798" },
    { id: "baochau",  name: "Bảo Châu",  role: "member",  tags: ["Chụp", "Retouch"],    pinHash: "07c38d426b9da55b192ce3d8d8690f3446ebe74c93541e439b995b90e95a6e55" },
    { id: "dinhdan",  name: "Đinh Đan",  role: "member",  tags: ["Chụp", "Quay"],       pinHash: "d245348cd5cd5c9568e4f9954176f49c71e35a64b01751b546cea079ca3bc43a" },
    { id: "anhduy",   name: "Anh Duy",   role: "member",  tags: ["Quay", "Retouch"],    pinHash: "9deccdb00b1e6ba25f416cab8b8267addea387fc919afa9754051b89ce1f9ae7" },
    { id: "ngocthao", name: "Ngọc Thảo", role: "viewer",  tags: [],                     pinHash: "4d72a88b9d2c68e55d4438a58ecd75da831cdda7f2889c6fc1c99059a773b256" }
  ],
  skillTags: ["Chụp", "Quay", "Retouch", "Điều phối"],

  /* ---------- BẢNG GIÁ (đồng bộ với web bảng giá) ----------
     price: giá cho 1 đơn vị (unit = "người" hoặc "cặp"). Giá niêm yết = price × số người/số cặp.
     hours: thời lượng gói (giờ) – dùng để tự điền giờ kết thúc. */
  pricing: {
    pregrad:  { name: "Pre-Graduation", options: {
      S: { label: "S – Single",            price: 599000,  hours: 3, unit: "người" },
      C: { label: "C – Couple",            price: 1099000, hours: 4, unit: "cặp" },
      G: { label: "G – Group (từ 3 người)", price: 499000,  hours: 6, unit: "người" } } },
    ceremony: { name: "Graduation Ceremony", options: {
      SAU: { label: "Sau lễ",          price: 499000, hours: 2.5, unit: "người" },
      TS:  { label: "Trước & Sau lễ",  price: 799000, hours: 4.5, unit: "người" } } },
    kyyeu:    { name: "Kỷ yếu", options: {
      S: { label: "S – Single",            price: 699000,  hours: 3, unit: "người" },
      C: { label: "C – Couple",            price: 1149000, hours: 4, unit: "cặp" },
      G: { label: "G – Group (từ 3 người)", price: 599000,  hours: 6, unit: "người" } } },
    fullday:  { name: "Kỷ yếu Fullday", fixedTime: ["07:00", "17:00"], options: {
      S: { label: "S – Single",            price: 1149000, hours: 10, unit: "người" },
      C: { label: "C – Couple",            price: 2049000, hours: 10, unit: "cặp" },
      G: { label: "G – Group (từ 3 người)", price: 999000,  hours: 10, unit: "người" } } }
  },
  extraHourPrice: 60000,       // extra giờ chụp: 60.000đ / giờ
  extraRetouchPrice: 100000,   // extra retouch: 100.000đ / 10 ảnh
  depositPct: 30,              // % đặt cọc đề xuất
  deliveryDays: 7,             // deadline trả ảnh mặc định = ngày chụp + N ngày
  retouchRounds: 3,            // số lần chỉnh sửa retouch được miễn phí
  debtReminderDays: 7,         // nhắc công nợ khi đã chụp quá N ngày mà chưa thu đủ

  /* ---------- NGUỒN KHÁCH ---------- */
  sources: ["Facebook page", "Instagram", "TikTok", "Zalo", "Bạn bè giới thiệu", "Khách cũ quay lại", "Lớp/Trường (đại diện lớp)", "Khác"],
  referralSource: "Bạn bè giới thiệu",   // chọn nguồn này sẽ hiện ô "Ai giới thiệu"

  /* ---------- TRẠNG THÁI (pipeline) ----------
     Chỉ đổi "name" (tên hiển thị) và "color". KHÔNG đổi "id" vì app dùng để tính toán. */
  statuses: [
    { id: "lead",    name: "Lead mới",               color: "#8C7B62" },
    { id: "tuvan",   name: "Đang tư vấn",            color: "#D9922E" },
    { id: "chot",    name: "Đã cọc / Chốt lịch",     color: "#A67C28" },
    { id: "dachup",  name: "Đã chụp",                color: "#6B8E9F" },
    { id: "retouch", name: "Chọn ảnh & Retouch",     color: "#B0753A" },
    { id: "giao",    name: "Đã giao file",           color: "#5E9B78" },
    { id: "hoantat", name: "Hoàn tất",               color: "#4E9F6B" },
    { id: "huy",     name: "Hủy / Dời lịch",         color: "#9A8F80" }
  ],

  locations: ["ĐH Kinh tế TP.HCM (UEH)", "ĐH Ngoại thương CS2 (FTU)", "ĐH Tài chính – Marketing (UFM)", "Nhà văn hoá Thanh Niên", "Bưu điện Thành phố", "Hồ Con Rùa", "Phố đi bộ Nguyễn Huệ"],
  paymentMethods: ["Chuyển khoản", "Tiền mặt", "Momo/Ví điện tử"],
  expenseCategories: ["Thuê địa điểm", "Đạo cụ", "Makeup", "Di chuyển", "Quảng cáo", "Thiết bị", "Khác"],
  campaigns: ["Ưu đãi ra mắt", "Ưu đãi gần Tết"],

  /* ---------- NƠI LƯU DỮ LIỆU ----------
     useFirebase: true  → cả team dùng CHUNG một bộ dữ liệu, đồng bộ tức thì giữa mọi máy (project Firebase "gsstudio-quanly").
                          Ai muốn vào phải đăng nhập Google bằng email đã được cấp quyền (Cài đặt → Truy cập dữ liệu chung).
     useFirebase: false → bản thử: lưu riêng trên trình duyệt từng máy, KHÔNG đồng bộ.
     Ghi chú: firebaseConfig là thông tin nhận diện công khai, không phải mật khẩu. Dữ liệu được bảo vệ bằng luật bảo mật trên Firebase. */
  useFirebase: true,
  firebaseConfig: {
    apiKey: "AIzaSyDOtNOHsnHGmoCaRrsY-FXxfuf4K92pXY4",
    authDomain: "gsstudio-quanly.firebaseapp.com",
    projectId: "gsstudio-quanly",
    storageBucket: "gsstudio-quanly.firebasestorage.app",
    messagingSenderId: "439032126441",
    appId: "1:439032126441:web:a17da14efe22ea82a2c978"
  }
};
</script>

<style>
:root{
  --bg:#FBF7EF; --card:#FFFFFF; --line:#EADFC6; --line-2:#F2EADA;
  --gold:#C9A24B; --gold-2:#E5B85C; --gold-3:#A67C28; --gold-soft:#F6EBD2;
  --text:#2A2118; --muted:#7A6C5A;
  --ok:#4E9F6B; --warn:#D9922E; --bad:#C4574A; --off:#9A8F80;
  --r:20px; --r-sm:14px;
  --shadow:0 1px 2px rgba(42,33,24,.04),0 6px 20px rgba(166,124,40,.07);
  --nav-h:66px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;
  font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em;margin:0}
h1{font-size:26px;line-height:1.2}
h2{font-size:20px;line-height:1.25}
h3{font-size:16.5px}
a{color:var(--gold-3)}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:lining-nums tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.hide{display:none!important}
.row{display:flex;gap:10px;align-items:center} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Khung ---------- */
.shell{min-height:100vh;display:flex}
.side{display:none}
.main{flex:1;min-width:0;padding:0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:rgba(251,247,239,.92);backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:10px;padding:10px 0;margin:0 -16px 6px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:8px;font-family:"Playfair Display",serif;font-weight:700;font-size:18px}
.brand img,.brand svg{width:34px;height:34px;border-radius:10px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.dot{position:absolute;top:7px;right:7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0 14px;flex-wrap:wrap}
.page-h p{margin:4px 0 0}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);min-height:52px;border-radius:14px;cursor:pointer;font-weight:500}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--gold-3);background:var(--gold-soft);font-weight:700}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:#FFFDF8}
  .side .brand{padding:4px 8px 18px}
  .side button.nav{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:14px;font-weight:500;color:var(--muted);cursor:pointer;text-align:left;min-height:44px}
  .side button.nav svg{width:20px;height:20px}
  .side button.nav.on{background:var(--gold-soft);color:var(--text);font-weight:700}
  .side .who{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
  .bnav{display:none}
  .shell{background:linear-gradient(90deg,#FFFDF8 250px,var(--bg) 250px)}
  .main{padding:0 28px 40px}
  .topbar{margin:0 -28px 6px;padding-left:28px;padding-right:28px}
  .topbar .brand{display:none}
}

/* ---------- Thành phần ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.md2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.lg3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{padding:14px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.stat.gold{background:linear-gradient(160deg,#FFF9EC,#F7E8C6);border-color:#E8D3A1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;text-decoration:none;color:var(--text);white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:hover{border-color:var(--gold)}
.btn-primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:#C29A42;color:var(--text)}
.btn-dark{background:var(--text);border-color:var(--text);color:#FFF8EA}
.btn-ghost{background:transparent;border-color:transparent}
.btn-danger{color:var(--bad);border-color:#E9C3BD}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:13.5px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--text);color:#FFF8EA;border-color:var(--text)}
.chip.sel{background:var(--gold-soft);border-color:var(--gold);color:var(--text);font-weight:600}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--gold-soft);color:var(--gold-3);font-size:11.5px;font-weight:600}

.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;border:2px solid #fff}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.av-lg{width:44px;height:44px;font-size:15px}

.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:#FFFEFB;outline:none}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(229,184,92,.25)}
.input.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(196,87,74,.12)}
.hint{font-size:12px;color:var(--muted)} .hint.err{color:var(--bad)}
.fgrid{display:grid;gap:12px}
@media (min-width:640px){.fgrid.c2{grid-template-columns:1fr 1fr}.fgrid.c3{grid-template-columns:1fr 1fr 1fr}}
.sect{border-top:1px solid var(--line-2);padding-top:16px;margin-top:18px}
.sect>h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sect>h3 .n{width:24px;height:24px;border-radius:8px;background:var(--gold-soft);color:var(--gold-3);font:700 12.5px "Be Vietnam Pro";display:grid;place-items:center}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line-2);cursor:pointer}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:14px}

.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;border:1px solid;font-size:14px;cursor:pointer}
.alert+.alert{margin-top:8px}
.alert.bad{background:#FBEDEA;border-color:#EFCFC9}
.alert.warn{background:#FCF3E4;border-color:#F0DDB8}
.alert.ok{background:#EDF6F0;border-color:#CFE5D7}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
.alert.bad svg{color:var(--bad)}.alert.warn svg{color:var(--warn)}.alert.ok svg{color:var(--ok)}

table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#FFFBF2}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Booking cards */
.bk{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card);cursor:pointer}
.bk:hover{border-color:var(--gold)}
.bk .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bk .nm{font-weight:700;font-size:15.5px}
.bk .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.bk .money{display:flex;justify-content:space-between;font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px}
.bk.warn-b{border-color:#E8B7AE}

/* Kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;align-items:flex-start}
.kcol{flex:none;width:min(84vw,290px);background:#F6F0E3;border-radius:18px;padding:10px;scroll-snap-align:start;border:2px solid transparent}
.kcol.over{border-color:var(--gold);background:#F9EED5}
.kcol-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;padding:4px 4px 10px}
.kcol-h .c{margin-left:auto;font-size:12px;color:var(--muted);background:#fff;border-radius:999px;padding:1px 9px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 6px;display:flex;gap:6px;cursor:pointer;margin-bottom:8px}
.kcard .grip{width:24px;flex:none;display:grid;place-items:center;color:#C8B998;cursor:grab;touch-action:none;border-radius:8px}
.kcard .grip:hover{background:var(--gold-soft);color:var(--gold-3)}
.kcard.dragging{opacity:.35}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:rotate(2deg);box-shadow:0 14px 30px rgba(42,33,24,.25);opacity:.95}
.kmin{min-height:60px;border:1.5px dashed #E4D6B6;border-radius:14px;display:grid;place-items:center;color:var(--muted);font-size:12.5px}

/* Lịch */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11.5px;text-align:center;color:var(--muted);font-weight:600;padding:4px 0}
.cal .d{min-height:74px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .d.out{opacity:.45}
.cal .d.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal .d .n{font-size:12.5px;font-weight:700}

/* SHA-256 (dùng cho PIN) – chạy được cả khi mở file trực tiếp không có crypto.subtle */
async function sha256(str) {
  if (window.crypto && crypto.subtle && window.isSecureContext) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  const K = [], H = [], isP = (n) => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
  for (let n = 2, c = 0; c < 64; n++) if (isP(n)) { if (c < 8) H[c] = (Math.pow(n, 1 / 2) * 2 ** 32) | 0; K[c++] = (Math.pow(n, 1 / 3) * 2 ** 32) | 0; }
  const bytes = [...new TextEncoder().encode(str)], l = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < bytes.length; i += 64) {
    const w = [];
    for (let j = 0; j < 16; j++) w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) | (bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
    for (let j = 16; j < 64; j++) { const s0 = r(w[j - 15], 7) ^ r(w[j - 15], 18) ^ (w[j - 15] >>> 3), s1 = r(w[j - 2], 17) ^ r(w[j - 2], 19) ^ (w[j - 2] >>> 10); w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0; }
    let [a, b, c, d, e, f, g, h] = H;
    for (let j = 0; j < 64; j++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[j] + w[j]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map((x) => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

  async save(c, obj) {

  async delete(c, id) { this._write(c, (await this.getAll(c)).filter((x) => x.id !== id)); },

  subscribe(cb) {

/* Thông báo lỗi Firebase dễ hiểu */
function fbMsg(e) {

const FirebaseAdapter = {
  name: "Firebase",
  db: null, auth: null, _unsubs: [],
  async init() {
    const v = "10.12.2", base = `https://www.gstatic.com/firebasejs/${v}/`;
    for (const f of ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"]) await loadScript(base + f);
    if (!CONFIG.firebaseConfig.apiKey) throw new Error("Chưa điền firebaseConfig trong CONFIG.");
    firebase.initializeApp(CONFIG.firebaseConfig);
    this.auth = firebase.auth();
    this.auth.languageCode = "vi";
    this.db = firebase.firestore();
    // Lưu bản sao dữ liệu trên máy → mở được khi mất mạng, thao tác offline sẽ tự đồng bộ khi có mạng
    try { await this.db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* trình duyệt không hỗ trợ – vẫn chạy online */ }
    try { await this.auth.getRedirectResult(); } catch (e) { setTimeout(() => toast("Đăng nhập Google lỗi: " + fbMsg(e), "err"), 300); }
    await new Promise((res) => { const off = this.auth.onAuthStateChanged(() => { off(); res(); }); });
  },
  needsAuth() { return !this.auth.currentUser; },
  email() { return ((this.auth && this.auth.currentUser && this.auth.currentUser.email) || "").toLowerCase(); },
  async signIn() {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    try { await this.auth.signInWithPopup(p); }
    catch (e) {
      // Trình duyệt chặn cửa sổ bật lên (hay gặp khi mở app từ màn hình chính điện thoại) → chuyển trang để đăng nhập
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported"].includes(e.code)) return this.auth.signInWithRedirect(p);
      throw e;
    }
  },
  async signOut() { this._unsubs.forEach((f) => f()); this._unsubs = []; await this.auth.signOut(); },
  async checkAccess() {
    try { await this.db.collection("settings").limit(1).get(); return true; }
    catch (e) { if (e.code === "permission-denied") return false; throw e; }
  },
  /* Ghi dữ liệu: Firestore lưu vào máy ngay rồi đẩy lên mây. Không chờ quá 1,5 giây để app không bị "treo" khi mạng yếu/mất mạng;
     lỗi đến muộn (vd. bị từ chối quyền) vẫn được báo. */
  _w(p) {
    return new Promise((res, rej) => {
      let late = false;
      const t = setTimeout(() => { late = true; res(); p.catch((e) => toast("Chưa lưu được lên máy chủ: " + fbMsg(e), "err")); }, 1500);
      p.then(() => { if (!late) { clearTimeout(t); res(); } }, (e) => { if (!late) { clearTimeout(t); rej(e); } });
    });
  },
  async getAll(c) { const s = await this.db.collection(c).get(); return s.docs.map((d) => d.data()); },
  save(c, obj) { return this._w(this.db.collection(c).doc(obj.id).set(clone(obj))); },
  async saveMany(c, list) {
    for (let i = 0; i < list.length; i += 400) {
      const batch = this.db.batch();
      list.slice(i, i + 400).forEach((o) => batch.set(this.db.collection(c).doc(o.id), clone(o)));
      await this._w(batch.commit());
    }
  },
  delete(c, id) { return this._w(this.db.collection(c).doc(id).delete()); },
  async replaceAll(c, list) {
    const cur = await this.getAll(c);
    for (let i = 0; i < cur.length; i += 400) {
      const batch = this.db.batch();
      cur.slice(i, i + 400).filter((o) => !list.find((x) => x.id === o.id)).forEach((o) => batch.delete(this.db.collection(c).doc(o.id)));
      await this._w(batch.commit());
    }
    await this.saveMany(c, list);
  },
  subscribe(cb) {
    this._unsubs.forEach((f) => f());
    this._unsubs = COLS.map((c) => this.db.collection(c).onSnapshot({ includeMetadataChanges: true },
      (s) => cb(c, s.docs.map((d) => d.data()), s.metadata),
      (e) => toast("Mất kết nối dữ liệu: " + fbMsg(e), "err")));
  },
  // Danh sách email Google được phép (chỉ chủ project Firebase sửa được – xem luật bảo mật)
  async getAccess() { const d = await this.db.collection("access").doc("members").get(); return d.exists ? (d.data().emails || []) : []; },
  async setAccess(emails) { await this.db.collection("access").doc("members").set({ emails, updatedAt: new Date().toISOString(), updatedBy: this.email() }); }
};
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Không tải được " + src)); document.head.appendChild(s); });
}
const store = CONFIG.useFirebase ? FirebaseAdapter : LocalAdapter;

/* Dữ liệu trong bộ nhớ */
const DB = { bookings: [], tasks: [], expenses: [], settings: [] };
const SET = () => DB.settings.find((s) => s.id === "config") || { id: "config" };

async function persist(col, obj) {
  try { await store.save(col, clone(obj)); }
  catch (e) { toast("Lỗi lưu dữ liệu: " + e.message, "err"); return false; }
  const list = DB[col], i = list.findIndex((x) => x.id === obj.id);
  if (i >= 0) list[i] = obj; else list.push(obj);
  return true;
}
async function persistMany(col, arr) {
  if (!arr.length) return true;
  try { await store.saveMany(col, clone(arr)); }
  catch (e) { toast("Lỗi lưu dữ liệu: " + e.message, "err"); return false; }
  arr.forEach((obj) => { const i = DB[col].findIndex((x) => x.id === obj.id); if (i >= 0) DB[col][i] = obj; else DB[col].push(obj); });
  return true;
}
async function remove(col, id) {
  try { await store.delete(col, id); }
  catch (e) { toast("Lỗi xoá dữ liệu: " + e.message, "err"); return false; }
  DB[col] = DB[col].filter((x) => x.id !== id);
  return true;
}
async function saveSettings(patch) {

}

const team = () => cfg("team");
const person = (id) => team().find((p) => p.id === id);
const pname = (id) => person(id)?.name || (id ? "(đã xoá)" : "");
const STAGES = ["lead", "tuvan", "chot", "dachup", "retouch", "giao", "hoantat"];
const stageIdx = (s) => STAGES.indexOf(s);
const statuses = () => cfg("statuses");
const stInfo = (id) => statuses().find((s) => s.id === id) || { id, name: id, color: "#9A8F80" };
const isClosed = (b) => stageIdx(b.status) >= 2;
const isActive = (b) => b.status !== "huy";
const pkgName = (b) => cfg("pricing")[b.pkg]?.name || b.pkg || "";
const optInfo = (b) => cfg("pricing")[b.pkg]?.options?.[b.tier];
const crew = (b) => uniq([...(b.shooters || []), b.videographer]);
const people = (b) => uniq([...(b.shooters || []), b.videographer, b.retoucher, b.coordinator]);

function listPrice(b) { const o = optInfo(b); return o ? o.price * Math.max(1, +b.qty || 1) : 0; }
function calc(b) {
  const list = listPrice(b);
  const exH = (+b.extraHours || 0) * cfg("extraHourPrice");
  const exR = (+b.extraRetouch || 0) * cfg("extraRetouchPrice");
  const disc = +b.discount || 0;
  const total = Math.max(0, list + exH + exR - disc);
  const paid = sum(b.payments || [], (p) => p.amount);
  const dp = b.depositPct ?? cfg("depositPct");
  const deposit = Math.round((total * dp) / 100 / 1000) * 1000;
  return { list, exH, exR, disc, total, paid, remain: Math.max(0, total - paid), deposit, depositPct: dp };
}
function nextCode() {
  const t = todayStr(), pre = `GS-${t.slice(2, 4)}${t.slice(5, 7)}-`;
  const n = DB.bookings.filter((b) => (b.code || "").startsWith(pre)).map((b) => parseInt(b.code.slice(pre.length), 10) || 0);
  return pre + String((n.length ? Math.max(...n) : 0) + 1).padStart(3, "0");
}

/* Trùng lịch: cùng người chụp/quay, cùng ngày, giờ chồng nhau */
function conflicts() {
  const act = DB.bookings.filter((b) => isActive(b) && stageIdx(b.status) >= 1 && b.date && b.start && b.end);
  const out = [];
  for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
    const a = act[i], b = act[j];
    if (a.date !== b.date) continue;
    if (!(timeToMin(a.start) < timeToMin(b.end) && timeToMin(b.start) < timeToMin(a.end))) continue;
    const shared = crew(a).filter((p) => crew(b).includes(p));
    if (shared.length) out.push({ a, b, people: shared });
  }
  return out;
}
const conflictIds = () => { const s = new Set(); conflicts().forEach((c) => { s.add(c.a.id); s.add(c.b.id); }); return s; };
function freePeople(date, start, end, excludeId, tag = "Chụp") {
  const busy = new Set();
  DB.bookings.filter((b) => isActive(b) && stageIdx(b.status) >= 1 && b.id !== excludeId && b.date === date && timeToMin(b.start) < timeToMin(end) && timeToMin(start) < timeToMin(b.end))
    .forEach((b) => crew(b).forEach((p) => busy.add(p)));
  return team().filter((p) => p.role !== "viewer" && (p.tags || []).includes(tag) && !busy.has(p.id));
}

/* Cảnh báo & nhắc việc */
function alerts() {
  const t = todayStr(), out = [];
  const conf = conflicts();
  DB.bookings.filter(isActive).forEach((b) => {
    const c = calc(b), st = stageIdx(b.status);
    if (b.deadline && st >= 2 && st < 5) {
      const d = diffDays(t, b.deadline);
      if (d < 0) out.push({ lv: "bad", type: "overdue", b, text: `Trễ hạn trả ảnh ${-d} ngày – ${b.customer?.name} (${b.code})` });
      else if (d <= 2) out.push({ lv: "warn", type: "due", b, text: `Sắp đến hạn trả ảnh (${d === 0 ? "hôm nay" : "còn " + d + " ngày"}) – ${b.customer?.name}` });
    }
    if (b.date && st <= 2 && c.paid <= 0) {
      const d = diffDays(t, b.date);
      if (d >= 0 && d <= 3) out.push({ lv: "bad", type: "nodeposit", b, text: `Chưa cọc, chụp ${d === 0 ? "hôm nay" : "sau " + d + " ngày"} – ${b.customer?.name}` });
    }
    if (b.date && st >= 1 && st <= 2 && diffDays(t, b.date) === 1) out.push({ lv: "warn", type: "tomorrow", b, text: `Chụp ngày mai ${b.start || ""} – ${b.customer?.name} @ ${b.location || "?"}` });
    if (b.date && st >= 3 && c.remain > 0 && diffDays(b.date, t) > cfg("debtReminderDays")) out.push({ lv: "bad", type: "debt", b, text: `Công nợ ${money(c.remain)} quá ${cfg("debtReminderDays")} ngày – ${b.customer?.name}` });
  });
  conf.forEach((c) => out.push({ lv: "bad", type: "conflict", b: c.a, text: `Trùng lịch ${c.people.map(pname).join(", ")}: ${c.a.customer?.name} & ${c.b.customer?.name} (${fmtDs(c.a.date)})` }));
  return out.sort((x, y) => (x.lv === y.lv ? 0 : x.lv === "bad" ? -1 : 1));
}

/* Tự sinh công việc từ booking */
const TASK_TYPES = { chup: "Chụp", quay: "Quay", chonanh: "Chọn ảnh", retouch: "Retouch", giaofile: "Giao file", cskh: "Chăm sóc khách", khac: "Khác" };
function autoTasksFor(b) {
  const out = [], t = todayStr(), st = stageIdx(b.status);
  const existing = (key) => DB.tasks.find((x) => x.key === key);
  const want = (key, type, assignee, due, title) => {
    if (!assignee) return;
    const ex = existing(key);
    if (ex) {
      let changed = false;
      if (ex.status !== "done" && ex.due !== due && due) { ex.due = due; changed = true; }
      if (changed) out.push(ex);
      return;
    }
    out.push({ id: "auto_" + key.replace(/[^A-Za-z0-9_-]/g, "_"), key, type, title, assignee, bookingId: b.id, due, status: "todo", auto: true, createdAt: new Date().toISOString() });
  };
  const doneIf = (key, cond) => { const ex = existing(key); if (ex && cond && ex.status !== "done") { ex.status = "done"; ex.doneAt = new Date().toISOString(); out.push(ex); } };
  if (b.status === "huy" || !isClosed(b) || !b.date) return out;
  const nm = b.customer?.name || b.code;
  (b.shooters || []).forEach((p) => want(`${b.id}:chup:${p}`, "chup", p, b.date, `Chụp ${nm}`));
  if (b.videographer) want(`${b.id}:quay`, "quay", b.videographer, b.date, `Quay ${nm}`);
  const shot = st >= 3 || b.date < t;
  if (shot) {
    const dl = b.deadline || addDays(b.date, cfg("deliveryDays"));
    want(`${b.id}:chonanh`, "chonanh", b.coordinator || (b.shooters || [])[0], addDays(b.date, 2), `Gửi file gốc & chọn ảnh – ${nm}`);
    want(`${b.id}:retouch`, "retouch", b.retoucher || (b.shooters || [])[0], addDays(dl, -1), `Retouch – ${nm}`);
    want(`${b.id}:giaofile`, "giaofile", b.coordinator || b.retoucher, dl, `Giao file – ${nm}`);
  }
  (b.shooters || []).forEach((p) => doneIf(`${b.id}:chup:${p}`, st >= 3));
  doneIf(`${b.id}:quay`, st >= 3);
  doneIf(`${b.id}:chonanh`, st >= 4);
  doneIf(`${b.id}:retouch`, st >= 5);
  doneIf(`${b.id}:giaofile`, st >= 5);
  return uniq(out);
}
async function syncTasks(bks) {
  const list = [];
  (bks || DB.bookings).forEach((b) => autoTasksFor(b).forEach((t) => { if (!list.includes(t)) list.push(t); }));
  if (list.length) await persistMany("tasks", list);
}

/* Lịch sử thay đổi */
function diffText(a, b) {
  if (!a) return "Tạo booking";
  const ch = [];
  if (a.status !== b.status) ch.push(`trạng thái: ${stInfo(a.status).name} → ${stInfo(b.status).name}`);
  if (a.date !== b.date || a.start !== b.start || a.end !== b.end) ch.push(`lịch: ${fmtDs(b.date)} ${b.start || ""}–${b.end || ""}`);
  if (a.location !== b.location) ch.push(`địa điểm: ${b.location || "(trống)"}`);
  const ca = calc(a), cb = calc(b);
  if (ca.total !== cb.total) ch.push(`tổng: ${money(ca.total)} → ${money(cb.total)}`);
  if (ca.paid !== cb.paid) ch.push(`đã thu: ${money(ca.paid)} → ${money(cb.paid)}`);
  if (JSON.stringify(people(a)) !== JSON.stringify(people(b))) ch.push(`phân công: ${people(b).map(pname).join(", ") || "(trống)"}`);
  if (a.deadline !== b.deadline) ch.push(`deadline: ${fmtD(b.deadline)}`);
  if ((a.retouchUsed || 0) !== (b.retouchUsed || 0)) ch.push(`chỉnh sửa retouch: ${b.retouchUsed || 0}/${cfg("retouchRounds")}`);
  if (a.driveLink !== b.driveLink) ch.push("link Drive");
  if (a.customer?.name !== b.customer?.name || a.customer?.phone !== b.customer?.phone) ch.push("thông tin khách");
  if (a.notes !== b.notes) ch.push("ghi chú");
  return ch.length ? "Cập nhật " + ch.join("; ") : "Lưu (không đổi thông tin chính)";
}
async function saveBooking(b, prev) {
  b.updatedAt = new Date().toISOString(); b.updatedBy = me().id;
  b.history = [...(b.history || []), { at: b.updatedAt, by: me().id, text: diffText(prev, b) }].slice(-60);
  if (!prev) { b.createdAt = b.updatedAt; b.createdBy = me().id; }
  if (isClosed(b) && !b.closedAt) b.closedAt = b.updatedAt;
  if (b.status === "hoantat" && !b.doneAt) b.doneAt = b.updatedAt;
  const ok = await persist("bookings", b);
  if (ok) await syncTasks([b]);
  return ok;
}

const UI = {

};

const saveUI = () => { try { localStorage.setItem("gsql_ui", JSON.stringify({ view: UI.view, bView: UI.bView, range: UI.range, calMode: UI.calMode, rep: UI.rep })); } catch (e) {} };

function rangeOf(kind, from, to, offset = 0) {
  const t = todayStr();
  if (kind === "today") { const d = addDays(t, offset); return { from: d, to: d, label: "Hôm nay" }; }
  if (kind === "week") { const s = addDays(weekStart(t), offset * 7); return { from: s, to: addDays(s, 6), label: `Tuần ${fmtDs(s)} – ${fmtD(addDays(s, 6))}` }; }
  if (kind === "month") { const s = addMonths(t, offset); return { from: s, to: monthEnd(s), label: `Tháng ${s.slice(5, 7)}/${s.slice(0, 4)}` }; }
  const f = isDate(from) ? from : monthStart(t), e = isDate(to) && to >= f ? to : t;
  return { from: f, to: e, label: `${fmtD(f)} – ${fmtD(e)}` };
}
const inR = (d, r) => d && d >= r.from && d <= r.to;
const prevRange = (r) => { const n = diffDays(r.from, r.to) + 1; return { from: addDays(r.from, -n), to: addDays(r.from, -1) }; };

/* Số liệu theo kỳ */
function metrics(r) {
  const bk = DB.bookings;
  const leads = bk.filter((b) => inR(dateOfISO(b.createdAt), r));
  const closedFromLeads = leads.filter(isClosed);
  const closed = bk.filter((b) => isClosed(b) && inR(dateOfISO(b.closedAt || b.createdAt), r));
  const shot = bk.filter((b) => isClosed(b) && inR(b.date, r));
  const revenue = sum(shot, (b) => calc(b).total);
  const collected = sum(bk.flatMap((b) => (b.payments || []).filter((p) => inR(p.date, r))), (p) => p.amount);
  const t = todayStr();
  // Công nợ = tiền còn phải thu của booking ĐÃ CHỤP; booking chưa chụp tính vào "phải thu sắp tới"
  const debt = sum(bk.filter((b) => isClosed(b) && isActive(b) && b.date && b.date <= t), (b) => calc(b).remain);
  const receivable = sum(bk.filter((b) => isClosed(b) && isActive(b) && (!b.date || b.date > t)), (b) => calc(b).remain);
  const upcoming = bk.filter((b) => isActive(b) && stageIdx(b.status) >= 1 && b.date >= t && b.date <= addDays(t, 6));
  return { leads, closedFromLeads, closed, shot, revenue, collected, debt, receivable, upcoming, rate: pct(closedFromLeads.length, leads.length) };
}
function groupBy(list, keyFn) { const m = new Map(); list.forEach((x) => { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }

const AV_COLORS = ["#A67C28", "#6B8E9F", "#B0753A", "#5E9B78", "#8C6A9F", "#C4574A", "#7A6C5A"];
function av(id, cls = "") {
  const p = person(id); if (!p) return "";
  const i = Math.max(0, team().indexOf(p));
  const ini = p.name.split(" ").map((w) => w[0]).slice(-2).join("").toUpperCase();
  return `<span class="av ${cls}" title="${esc(p.name)}" style="background:${AV_COLORS[i % AV_COLORS.length]}">${esc(ini)}</span>`;
}
const avs = (ids) => `<span class="avs">${uniq(ids).map((i) => av(i)).join("")}</span>`;
function pill(statusId) {
  const s = stInfo(statusId);
  return `<span class="pill" style="color:${s.color};background:${s.color}1A">${"<i></i>"}${esc(s.name)}</span>`;
}
const roleName = (r) => ({ manager: "Quản lý / Điều phối", member: "Thành viên", viewer: "Chỉ xem" }[r] || r);
function barList(items, opt = {}) {
  const max = Math.max(1, ...items.map((x) => x.value));
  if (!items.length || items.every((x) => !x.value)) return `<div class="empty">Chưa có dữ liệu trong kỳ này</div>`;
  return `<div class="bars">${items.map((x) => `<div class="bar-r"><span class="ellipsis" title="${esc(x.label)}">${esc(x.label)}</span><div class="tr"><div class="fl" style="width:${Math.max(2, (x.value / max) * 100)}%;${x.color ? "background:" + x.color : ""}"></div></div><b>${opt.money ? moneyShort(x.value) : x.value}${x.sub ? `<span class="muted tiny"> ${x.sub}</span>` : ""}</b></div>`).join("")}</div>`;
}
function columnChart(items, opt = {}) {
  if (!items.length) return `<div class="empty">Chưa có dữ liệu</div>`;
  const W = 640, H = 200, P = 26, max = Math.max(1, ...items.map((x) => x.value)), bw = (W - P * 2) / items.length;
  const bars = items.map((x, i) => {
    const h = ((H - 50) * x.value) / max, X = P + i * bw + bw * 0.18, w = bw * 0.64, Y = H - 26 - h;
    return `<rect x="${X}" y="${Y}" width="${w}" height="${Math.max(h, 1.5)}" rx="6" fill="url(#gg)"/>
      ${x.value ? `<text x="${X + w / 2}" y="${Y - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="#2A2118">${opt.money ? moneyShort(x.value) : x.value}</text>` : ""}
      <text x="${X + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11.5" fill="#7A6C5A">${esc(x.label)}</text>`;
  }).join("");
  return `<div class="vchart"><svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5B85C"/><stop offset="1" stop-color="#A67C28"/></linearGradient></defs><line x1="${P}" y1="${H - 26}" x2="${W - P}" y2="${H - 26}" stroke="#EADFC6"/>${bars}</svg></div>`;
}
const opts = (list, val, empty) => (empty !== undefined ? `<option value="">${esc(empty)}</option>` : "") + list.map((o) => { const v = typeof o === "object" ? o.v : o, l = typeof o === "object" ? o.l : o; return `<option value="${esc(v)}" ${String(v) === String(val ?? "") ? "selected" : ""}>${esc(l)}</option>`; }).join("");

/* ---------- Modal ---------- */
function openModal(html, cls = "") {

const mHead = (title, extra = "") => `<div class="sheet-h"><h2 class="ellipsis">${title}</h2>${extra}<button class="icon-btn" data-act="close" aria-label="Đóng">${ic("x")}</button></div>`;
function confirmBox(msg, okLabel = "Đồng ý", danger = false) {
  return new Promise((res) => {
    const prev = $("#modal-root").innerHTML;
    const box = document.createElement("div");
    box.className = "ov"; box.style.zIndex = 80;
    box.innerHTML = `<div class="sheet sm"><div class="sheet-b"><p style="margin:4px 0 0;font-size:15.5px">${msg}</p></div><div class="sheet-f"><button class="btn grow" data-c="0">Huỷ</button><button class="btn grow ${danger ? "btn-danger" : "btn-primary"}" data-c="1">${esc(okLabel)}</button></div></div>`;

function rangeChips(key = "range") {
  const k = UI[key];
  const list = [["today", "Hôm nay"], ["week", "Tuần này"], ["month", "Tháng này"], ["custom", "Tùy chọn"]];
  return `<div class="chips">${list.map(([v, l]) => `<button class="chip ${k === v ? "on" : ""}" data-act="setRange" data-k="${key}" data-v="${v}">${l}</button>`).join("")}</div>
  ${k === "custom" ? `<div class="row" style="margin-top:10px"><input type="date" class="input" data-act-change="rangeFrom" data-k="${key}" value="${esc(key === "range" ? UI.from : UI.repFrom)}"><span class="muted">→</span><input type="date" class="input" data-act-change="rangeTo" data-k="${key}" value="${esc(key === "range" ? UI.to : UI.repTo)}"></div>` : ""}`;
}
function vDashboard() {

  const myTasks = DB.tasks.filter((x) => x.assignee === ME.id && x.status !== "done" && x.due && x.due <= t).sort((a, b) => a.due.localeCompare(b.due));

  // doanh thu 8 tuần gần nhất (theo ngày chụp, booking đã chốt)
  const ws = weekStart(t), weeks = [];
  for (let i = 7; i >= 0; i--) { const s = addDays(ws, -7 * i), e = addDays(s, 6); weeks.push({ label: fmtDs(s), value: sum(DB.bookings.filter((b) => isClosed(b) && inR(b.date, { from: s, to: e })), (b) => calc(b).total) }); }
  const bySrc = [...groupBy(m.leads, (b) => b.source || "Khác")].map(([k, v]) => ({ label: k, value: v.length, sub: `· chốt ${v.filter(isClosed).length}` })).sort((a, b) => b.value - a.value);
  const byPkg = [...groupBy(m.shot.length ? m.shot : m.closed, (b) => pkgName(b))].map(([k, v]) => ({ label: k, value: v.length })).sort((a, b) => b.value - a.value);
  const S = (k, v, s, cls = "") => `<div class="card stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
  return `
  <div class="page-h"><div><h1>Chào ${esc(ME.name)} 👋</h1><p class="muted small">${DOW[dow(t)]}, ${fmtD(t)} · ${esc(r.label)}</p></div>

  ${rangeChips()}
  <div class="grid g2 g4" style="margin-top:14px">
    ${S("Lead mới", m.leads.length, "khách liên hệ trong kỳ")}
    ${S("Booking đã chốt", m.closed.length, "đã cọc / chốt lịch")}
    ${S("Tỉ lệ chốt", m.rate + "%", `${m.closedFromLeads.length}/${m.leads.length} lead`)}
    ${S("Sắp chụp 7 ngày", m.upcoming.length, "buổi chụp")}
    ${S("Doanh thu dự kiến", money(m.revenue), "booking có ngày chụp trong kỳ", "gold")}
    ${S("Đã thu", money(m.collected), "tiền nhận trong kỳ")}
    ${S("Công nợ còn lại", `<span style="color:${m.debt ? "var(--bad)" : "inherit"}">${money(m.debt)}</span>`, `đã chụp chưa thu đủ · sắp thu ${moneyShort(m.receivable)}`)}
    ${S("Booking đang chạy", DB.bookings.filter((b) => isActive(b) && stageIdx(b.status) < 6).length, "chưa hoàn tất")}
  </div>
  <div class="grid md2" style="margin-top:12px">
    <div class="card"><div class="card-h"><h3>Cảnh báo</h3><span class="muted small">${al.length} mục</span></div>
      ${al.length ? al.slice(0, 7).map((a) => `<div class="alert ${a.lv}" data-act="openBk" data-id="${a.b.id}">${ic("alert")}<span>${esc(a.text)}</span></div>`).join("") + (al.length > 7 ? `<button class="btn btn-ghost btn-sm" data-act="notifs" style="margin-top:6px">Xem tất cả ${al.length}</button>` : "") : `<div class="alert ok">${ic("check")}<span>Mọi thứ đang ổn, không có cảnh báo 🎉</span></div>`}
    </div>

      ${myShoots.map((b) => `<div class="alert warn" data-act="openBk" data-id="${b.id}">${ic("clock")}<span><b>${esc(b.start)}–${esc(b.end)}</b> Chụp ${esc(b.customer?.name)} @ ${esc(b.location || "?")}</span></div>`).join("")}
      ${myTasks.length ? `<div style="margin-top:6px">${myTasks.slice(0, 8).map(taskRow).join("")}</div>` : !myShoots.length ? `<div class="empty">Hôm nay bạn không có việc tới hạn ✨</div>` : ""}
    </div>` : `<div class="card"><div class="card-h"><h3>Sắp chụp 7 ngày tới</h3></div>${m.upcoming.length ? m.upcoming.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start)).map((b) => `<div class="li" data-act="openBk" data-id="${b.id}"><div class="grow"><div class="t">${esc(b.customer?.name)}</div><div class="small muted">${DOW[dow(b.date)]} ${fmtDs(b.date)} · ${esc(b.start)} · ${esc(pkgName(b))}</div></div>${avs(crew(b))}</div>`).join("") : `<div class="empty">Chưa có lịch chụp</div>`}</div>`}

  </div>`;
}

/* ================================================================
   2) BOOKING
   ================================================================ */
function filteredBookings() {
  const f = UI.f, q = f.q.trim().toLowerCase();
  return DB.bookings.filter((b) => {
    if (f.active === "open" && (b.status === "hoantat" || b.status === "huy")) return false;
    if (f.status && b.status !== f.status) return false;
    if (f.source && b.source !== f.source) return false;
    if (f.pkg && b.pkg !== f.pkg) return false;
    if (f.person && !people(b).includes(f.person)) return false;
    if (q) { const hay = [b.code, b.customer?.name, b.customer?.phone, normPhone(b.customer?.phone), b.customer?.school, b.location].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }).sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (b.createdAt || "").localeCompare(a.createdAt || ""));
}
function bkCard(b, conf) {
  const c = calc(b), t = todayStr();
  const late = b.deadline && stageIdx(b.status) >= 2 && stageIdx(b.status) < 5 && b.deadline < t;
  return `<div class="bk ${conf.has(b.id) || late ? "warn-b" : ""}" data-act="openBk" data-id="${b.id}">
    <div class="top"><div class="grow"><div class="nm ellipsis">${esc(b.customer?.name || "(chưa có tên)")}</div><div class="tiny muted">${esc(b.code)} · ${esc(b.source || "")}</div></div>${pill(b.status)}</div>
    <div class="meta"><span>${ic("cal", "").replace("<svg", '<svg width="13" height="13" style="vertical-align:-2px"')} ${b.date ? DOWS[dow(b.date)] + " " + fmtD(b.date) + " · " + esc(b.start || "") : "Chưa có lịch"}</span><span>${esc(pkgName(b))} ${esc(b.tier || "")}${b.qty > 1 ? " ×" + b.qty : ""}</span>${conf.has(b.id) ? `<span style="color:var(--bad);font-weight:600">⚠ Trùng lịch</span>` : ""}${late ? `<span style="color:var(--bad);font-weight:600">⚠ Trễ hạn</span>` : ""}</div>
    <div class="money"><span>Tổng <b>${money(c.total)}</b></span><span>${!isClosed(b) ? `<span class="muted">Báo giá</span>` : c.remain ? `Còn <b style="color:var(--bad)">${money(c.remain)}</b>` : c.total ? `<b style="color:var(--ok)">Đã thu đủ</b>` : ""}</span>${avs(people(b))}</div>
  </div>`;
}

        ${show.map((b) => { const c = calc(b); return `<div class="kcard" data-id="${b.id}" data-act="openBk">${canEdit(b) && !isViewer() ? `<span class="grip" data-grip title="Kéo để đổi trạng thái">${ic("grip")}</span>` : `<span style="width:6px"></span>`}<div class="grow"><div style="font-weight:700" class="ellipsis">${esc(b.customer?.name)}</div><div class="tiny muted">${b.date ? fmtDs(b.date) + " " + esc(b.start || "") : "Chưa có lịch"} · ${esc(pkgName(b))}</div><div class="row between" style="margin-top:6px"><span class="tiny">${!isClosed(b) ? `<span class="muted">${moneyShort(c.total)}</span>` : c.remain ? `<span style="color:var(--bad)">Còn ${moneyShort(c.remain)}</span>` : `<span style="color:var(--ok)">${moneyShort(c.total)}</span>`}${conf.has(b.id) ? ' · <span style="color:var(--bad)">⚠</span>' : ""}</span>${avs(people(b))}</div></div></div>`; }).join("") || `<div class="kmin">Kéo thả vào đây</div>`}
        ${s.id === "hoantat" && f.active === "open" ? `<div class="tiny muted" style="text-align:center">Chỉ hiện 3 booking gần nhất</div>` : ""}
      </div>`;
    }).join("")}</div>`;
  }
  return head + `<div class="grid md2 lg3" style="margin-top:12px">${list.map((b) => bkCard(b, conf)).join("") || `<div class="card empty" style="grid-column:1/-1">Không có booking phù hợp. ${!isViewer() ? `<br><br><button class="btn btn-primary" data-act="newBooking">${ic("plus")}Tạo booking</button>` : ""}</div>`}</div>`;

let DRAG = null;
document.addEventListener("pointerdown", (e) => {
  const g = e.target.closest("[data-grip]"); if (!g) return;
  const card = g.closest(".kcard"); if (!card) return;
  e.preventDefault(); e.stopPropagation();
  const r = card.getBoundingClientRect(), ghost = card.cloneNode(true);
  ghost.classList.add("ghost"); ghost.style.width = r.width + "px"; ghost.style.left = r.left + "px"; ghost.style.top = r.top + "px";
  document.body.appendChild(ghost); card.classList.add("dragging");
  DRAG = { id: card.dataset.id, card, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, moved: false };
  try { g.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener("pointermove", (e) => {
  if (!DRAG) return;
  DRAG.moved = true;
  DRAG.ghost.style.left = e.clientX - DRAG.dx + "px"; DRAG.ghost.style.top = e.clientY - DRAG.dy + "px";
  const board = $(".board");
  if (board) { if (e.clientX > innerWidth - 50) board.scrollLeft += 14; else if (e.clientX < 50) board.scrollLeft -= 14; }
  $$(".kcol.over").forEach((c) => c.classList.remove("over"));
  const col = document.elementFromPoint(e.clientX, e.clientY)?.closest(".kcol");
  if (col) col.classList.add("over");
});
document.addEventListener("pointerup", async (e) => {
  if (!DRAG) return;
  const d = DRAG; DRAG = null;
  d.ghost.remove(); d.card.classList.remove("dragging");
  $$(".kcol.over").forEach((c) => c.classList.remove("over"));
  const col = document.elementFromPoint(e.clientX, e.clientY)?.closest(".kcol");
  UI._boardScroll = $(".board")?.scrollLeft || 0;
  window.__suppressClick = true; setTimeout(() => (window.__suppressClick = false), 50);
  if (col && d.moved) await changeStatus(d.id, col.dataset.status);
});
async function changeStatus(id, st) {
  const b = DB.bookings.find((x) => x.id === id); if (!b || b.status === st) return;
  if (!canEdit(b)) return toast("Bạn không có quyền sửa booking này", "err");
  const prev = clone(b), nb = clone(b); nb.status = st;
  if (await saveBooking(nb, prev)) { toast(`Đã chuyển sang “${stInfo(st).name}”`); rerender(); }
}

function setPath(o, path, v) { const k = path.split("."); let x = o; for (let i = 0; i < k.length - 1; i++) x = x[k[i]] = x[k[i]] || {}; x[k[k.length - 1]] = v; }
function getPath(o, path) { return path.split(".").reduce((x, k) => (x == null ? x : x[k]), o); }
function saveDraft() { if (FORM?.isNew) { try { localStorage.setItem(DRAFT_KEY(), JSON.stringify(FORM.b)); } catch (e) {} } }
function validatePhoneHint() {
  const h = $("#h-phone"), inp = $('[data-k="customer.phone"]'); if (!h || !inp) return;
  const v = inp.value.trim();
  if (v && !validPhone(v)) { h.textContent = "SĐT chưa đúng (VD: 0901234567)"; h.className = "hint err"; inp.classList.add("err"); }
  else { h.textContent = ""; h.className = "hint"; inp.classList.remove("err"); }
}
function onFormInput(el, commit) {
  const b = FORM.b;
  if (el.dataset.pay) {
    const [i, f] = el.dataset.pay.split(".");
    b.payments[+i][f] = el.dataset.money ? parseMoney(el.value) : el.value;
  } else if (el.dataset.k) {
    const k = el.dataset.k;
    let v = el.value;
    if (el.dataset.num) v = el.value === "" ? 0 : Math.max(0, +el.value);
    if (el.dataset.money) v = parseMoney(el.value);
    const old = getPath(b, k);
    setPath(b, k, v);
    // Ràng buộc tự động
    const P = cfg("pricing");
    if (k === "pkg") { b.tier = Object.keys(P[b.pkg].options)[0]; }
    if ((k === "pkg" || k === "tier") && P[b.pkg]) {
      const o = P[b.pkg].options[b.tier];
      if (P[b.pkg].fixedTime) { b.start = P[b.pkg].fixedTime[0]; b.end = P[b.pkg].fixedTime[1]; }
      else if (o) b.end = minToTime(timeToMin(b.start || "08:00") + o.hours * 60);
    }
    if (k === "start" && old) { const o = P[b.pkg]?.options?.[b.tier]; if (o && !P[b.pkg].fixedTime) b.end = minToTime(timeToMin(v) + o.hours * 60); }
    if (k === "date" && v && isDate(v)) { const prevDl = old ? addDays(old, cfg("deliveryDays")) : ""; if (!b.deadline || b.deadline === prevDl) b.deadline = addDays(v, cfg("deliveryDays")); }
    if (k === "customer.phone") validatePhoneHint();
    if (commit && el.dataset.rerender) { saveDraft(); return paintForm(); }
  }
  if (commit && el.dataset.money) el.value = fmtMoneyInput(parseMoney(el.value));
  const box = $("#moneyBox"); if (box) box.innerHTML = moneyBoxHTML(calc(b), b);
  saveDraft();
}
async function submitForm() {
  const b = FORM.b, errs = [];
  b.customer.name = (b.customer.name || "").trim(); b.customer.phone = (b.customer.phone || "").trim();
  if (!b.customer.name) errs.push("Nhập họ tên khách");
  if (!b.customer.phone) errs.push("Nhập SĐT/Zalo của khách");
  else if (!validPhone(b.customer.phone)) errs.push("SĐT chưa đúng định dạng (VD: 0901234567)");
  if (b.date && !isDate(b.date)) errs.push("Ngày chụp không hợp lệ");
  if (b.deadline && !isDate(b.deadline)) errs.push("Deadline không hợp lệ");
  if (b.date && b.start && b.end && timeToMin(b.end) <= timeToMin(b.start)) errs.push("Giờ kết thúc phải sau giờ bắt đầu");
  if (isClosed(b) && !b.date) errs.push("Booking đã chốt cần có ngày chụp");
  if (+b.qty < 1) errs.push("Số người/cặp tối thiểu là 1");
  (b.payments || []).forEach((p, i) => { if (!(+p.amount > 0)) errs.push(`Lần thanh toán ${i + 1}: số tiền phải lớn hơn 0`); if (!isDate(p.date)) errs.push(`Lần thanh toán ${i + 1}: thiếu ngày`); });
  if (+b.discount > listPrice(b) + 1e9) errs.push("Giảm giá quá lớn");
  if (errs.length) { toast(errs[0], "err"); return; }
  b.qty = Math.max(1, Math.round(+b.qty)); b.retouchUsed = Math.round(+b.retouchUsed || 0);
  if (!FORM.isNew) { const cur = DB.bookings.find((x) => x.id === b.id); if (cur && !canEdit(cur)) return toast("Bạn không có quyền sửa booking này", "err"); }
  const ok = await saveBooking(clone(b), FORM.prev);
  if (!ok) return;
  if (FORM.isNew) { try { localStorage.removeItem(DRAFT_KEY()); } catch (e) {} }
  const id = b.id; closeModal(); toast("Đã lưu booking " + b.code); rerender(); openBooking(id);
}

function icsFor(list) {
  const pad = (n) => String(n).padStart(2, "0");
  const utc = (date, time) => { const [y, m, d] = date.split("-").map(Number), [hh, mm] = (time || "08:00").split(":").map(Number); const t = new Date(Date.UTC(y, m - 1, d, hh - 7, mm)); return `${t.getUTCFullYear()}${pad(t.getUTCMonth() + 1)}${pad(t.getUTCDate())}T${pad(t.getUTCHours())}${pad(t.getUTCMinutes())}00Z`; };
  const escI = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/[,;]/g, (m) => "\\" + m).replace(/\n/g, "\\n");
  const now = utc(todayStr(), nowTime());
  const ev = list.filter((b) => b.date).map((b) => ["BEGIN:VEVENT", `UID:${b.id}@gsstudio`, `DTSTAMP:${now}`, `DTSTART:${utc(b.date, b.start)}`, `DTEND:${utc(b.date, b.end || b.start)}`,
    `SUMMARY:${escI(`📸 ${b.customer?.name} – ${pkgName(b)} (${b.code})`)}`, `LOCATION:${escI(b.location)}`,
    `DESCRIPTION:${escI(`SĐT: ${b.customer?.phone || ""}\nNgười chụp: ${(b.shooters || []).map(pname).join(", ")}\nConcept: ${b.concept || ""}\nTrạng thái: ${stInfo(b.status).name}`)}`, "END:VEVENT"].join("\r\n"));
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//GS.studio//Quan ly//VI", "CALSCALE:GREGORIAN", "X-WR-CALNAME:GS.studio – Lịch chụp", "X-WR-TIMEZONE:Asia/Ho_Chi_Minh", ...ev, "END:VCALENDAR"].join("\r\n");
}

function buildReport() {
  const r = rangeOf(UI.rep, UI.repFrom, UI.repTo, UI.repOffset), pr = prevRange(r);
  const m = metrics(r), mp = metrics(pr), t = todayStr();
  const delta = (a, b) => (a === b ? "không đổi" : b ? (a > b ? "▲ " : "▼ ") + Math.abs(pct(a - b, b)) + "%" : "▲ mới");
  const bySrc = cfg("sources").map((s) => { const l = m.leads.filter((b) => (b.source || "Khác") === s); return { s, n: l.length, c: l.filter(isClosed).length, rev: sum(l.filter(isClosed), (b) => calc(b).total) }; }).filter((x) => x.n);
  const pool = uniq([...m.shot, ...m.closed]);
  const byPkg = [...groupBy(pool, (b) => pkgName(b))].map(([k, v]) => ({ k, n: v.length, rev: sum(v, (b) => calc(b).total) })).sort((a, b) => b.rev - a.rev);
  const byPerson = team().filter((p) => p.role !== "viewer").map((p) => ({ p, shoots: m.shot.filter((b) => crew(b).includes(p.id)).length, done: DB.tasks.filter((x) => x.assignee === p.id && x.status === "done" && inR(dateOfISO(x.doneAt), r)).length, late: DB.tasks.filter((x) => x.assignee === p.id && x.status !== "done" && x.due && x.due < t).length }));
  const top = [...m.shot].sort((a, b) => calc(b).total - calc(a).total).slice(0, 3);
  const al = alerts();
  const risks = [];
  const late = al.filter((a) => a.type === "overdue"), dep = al.filter((a) => a.type === "nodeposit"), conf = al.filter((a) => a.type === "conflict");
  const debts = DB.bookings.filter((b) => isClosed(b) && calc(b).remain > 0 && b.date && b.date < t);
  if (late.length) risks.push(`${late.length} booking trễ hạn trả ảnh: ${late.map((a) => a.b.customer?.name).join(", ")}`);
  if (debts.length) risks.push(`Công nợ đã chụp chưa thu đủ: ${money(sum(debts, (b) => calc(b).remain))} (${debts.length} khách)`);
  if (dep.length) risks.push(`${dep.length} booking sắp chụp nhưng chưa cọc`);
  if (conf.length) risks.push(`${conf.length} trường hợp trùng lịch người chụp cần xử lý`);
  const nr = { from: addDays(r.to, 1), to: addDays(r.to, diffDays(r.from, r.to) + 1) };
  const next = DB.bookings.filter((b) => isActive(b) && stageIdx(b.status) >= 1 && inR(b.date, nr)).sort((a, b) => a.date.localeCompare(b.date));
  const nextDl = DB.bookings.filter((b) => isActive(b) && stageIdx(b.status) >= 2 && stageIdx(b.status) < 5 && inR(b.deadline, nr));
  const bestSrc = [...bySrc].sort((a, b) => b.c - a.c || b.rev - a.rev)[0];
  const summary = [
    `Kỳ này có ${m.leads.length} lead mới (${delta(m.leads.length, mp.leads.length)} so với kỳ trước), chốt ${m.closed.length} booking; tỉ lệ chốt ${m.rate}%.`,
    `Doanh thu dự kiến ${money(m.revenue)} từ ${m.shot.length} buổi chụp; đã thu ${money(m.collected)} (${delta(m.collected, mp.collected)}).`,
    `Công nợ (đã chụp, chưa thu đủ): ${money(m.debt)}; còn phải thu từ lịch sắp tới: ${money(m.receivable)}.`,
    bestSrc ? `Nguồn hiệu quả nhất: ${bestSrc.s} (${bestSrc.n} lead, ${bestSrc.c} chốt).` : "",
    risks.length ? `Cần chú ý: ${risks[0]}.` : "Không có rủi ro đáng kể trong kỳ."
  ].filter(Boolean);
  const plan = [
    next.length ? `${next.length} buổi chụp đã lên lịch (${fmtD(nr.from)} – ${fmtD(nr.to)})` : `Chưa có lịch chụp kỳ tới (${fmtD(nr.from)} – ${fmtD(nr.to)}) – cần đẩy tư vấn`,
    nextDl.length ? `${nextDl.length} bộ ảnh tới hạn giao` : "",
    DB.bookings.filter((b) => b.status === "tuvan").length ? `${DB.bookings.filter((b) => b.status === "tuvan").length} khách đang tư vấn cần chốt` : ""
  ].filter(Boolean);
  const nk = `${r.from}_${r.to}`;
  const note = (SET().reportNotes || {})[nk] || "";
  return { r, pr, m, mp, bySrc, byPkg, byPerson, top, risks, next, nextDl, summary, plan, nk, note, delta };
}
function reportText(R) {
  const L = [];
  L.push(`📊 BÁO CÁO GS.STUDIO – ${R.r.label.toUpperCase()}`);
  L.push(`Gửi ${CONFIG.reportTo},`, "");
  L.push("🔎 TÓM TẮT"); R.summary.forEach((s) => L.push("• " + s)); L.push("");
  L.push("📌 SỐ LIỆU CHÍNH");
  L.push(`• Lead mới: ${R.m.leads.length} | Chốt: ${R.m.closed.length} | Tỉ lệ chốt: ${R.m.rate}%`);
  L.push(`• Doanh thu dự kiến: ${money(R.m.revenue)}`, `• Đã thu: ${money(R.m.collected)}`, `• Công nợ (đã chụp): ${money(R.m.debt)}`, `• Phải thu từ lịch sắp tới: ${money(R.m.receivable)}`, "");
  if (R.byPkg.length) { L.push("📦 THEO GÓI"); R.byPkg.forEach((x) => L.push(`• ${x.k}: ${x.n} booking – ${money(x.rev)}`)); L.push(""); }
  if (R.bySrc.length) { L.push("📣 THEO NGUỒN"); R.bySrc.forEach((x) => L.push(`• ${x.s}: ${x.n} lead, ${x.c} chốt`)); L.push(""); }
  L.push("👥 THEO NGƯỜI"); R.byPerson.forEach((x) => L.push(`• ${x.p.name}: ${x.shoots} buổi chụp, ${x.done} việc xong${x.late ? `, ${x.late} việc trễ` : ""}`)); L.push("");
  if (R.top.length) { L.push("⭐ BOOKING NỔI BẬT"); R.top.forEach((b) => L.push(`• ${b.customer?.name} – ${pkgName(b)} – ${money(calc(b).total)}`)); L.push(""); }
  L.push("⚠️ VẤN ĐỀ / RỦI RO"); (R.risks.length ? R.risks : ["Không có"]).forEach((s) => L.push("• " + s)); L.push("");
  L.push("🗓 KẾ HOẠCH KỲ TỚI"); R.plan.forEach((s) => L.push("• " + s)); L.push("");
  if (R.note.trim()) { L.push(`📝 GHI CHÚ CỦA ${CONFIG.managerName.toUpperCase()}`); L.push(R.note.trim()); }
  return L.join("\n");
}

async function seed() {
  const list = sampleData();
  if (!(await persistMany("bookings", list))) return;
  await syncTasks(list);
  const exps = [{ id: "sample-e1", date: addDays(todayStr(), -6), category: "Quảng cáo", amount: 500000, note: "Boost bài Facebook", bookingId: "", createdBy: "vanlam", sample: true },

  await persistMany("expenses", exps);
}
async function unseed() {
  for (const b of DB.bookings.filter((x) => x.sample)) await remove("bookings", b.id);

async function doLogin() {

};
const CHANGE = {
  rangeFrom: (el) => { if (el.dataset.k === "range") UI.from = el.value; else UI.repFrom = el.value; rerender(); },
  rangeTo: (el) => { if (el.dataset.k === "range") UI.to = el.value; else UI.repTo = el.value; rerender(); },
  fsel: (el) => { UI.f[el.dataset.k] = el.value; rerender(); },
  quickStatus: (el) => changeStatus(el.dataset.id, el.value).then(() => openBooking(el.dataset.id)),
  calPerson: (el) => { UI.calPerson = el.value; rerender(); },
  teamPerson: (el) => { UI.teamPerson = el.value; rerender(); },
  finMonth: (el) => { if (/^\d{4}-\d{2}$/.test(el.value)) { UI.finMonth = el.value; rerender(); } },
  repFrom: (el) => { UI.repFrom = el.value; rerender(); },
  repTo: (el) => { UI.repTo = el.value; rerender(); },
  repNote: async (el) => { if (!isMgr()) return; const n = Object.assign({}, SET().reportNotes || {}, { [el.dataset.k]: el.value }); if (await saveSettings({ reportNotes: n })) toast("Đã lưu ghi chú"); },
  memName: (el) => { const v = el.value.trim(); if (!v) return toast("Tên không được trống", "err"); patchTeam((tm) => (tm[+el.dataset.i].name = v)); },
  memRole: (el) => patchTeam((tm) => (tm[+el.dataset.i].role = el.value)),
  price: async (el) => { const v = parseMoney(el.value); if (!(v > 0)) return toast("Giá phải lớn hơn 0", "err"); const P = clone(cfg("pricing")); P[el.dataset.p].options[el.dataset.o].price = v; if (await saveSettings({ pricing: P })) toast("Đã lưu giá"); },
  setNum: async (el) => { const v = el.dataset.money ? parseMoney(el.value) : +el.value; if (!(v >= 0) || isNaN(v)) return toast("Giá trị không hợp lệ", "err"); if (await saveSettings({ [el.dataset.k]: v })) toast("Đã lưu"); },
  setList: async (el) => { const v = uniq(el.value.split("\n").map((x) => x.trim())); if (!v.length) return toast("Danh sách không được trống", "err"); if (await saveSettings({ [el.dataset.k]: v })) toast("Đã lưu"); },
  stName: async (el) => { const v = el.value.trim(); if (!v) return; const s = clone(statuses()); s[+el.dataset.i].name = v; if (await saveSettings({ statuses: s })) toast("Đã lưu"); },
  importJSON: async (el) => {
    const f = el.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.bookings)) throw new Error("File không đúng định dạng sao lưu GS.studio");
      if (!(await confirmBox(`Nhập ${data.bookings.length} booking, ${(data.tasks || []).length} việc, ${(data.expenses || []).length} chi phí? <b>Dữ liệu hiện tại sẽ bị thay thế.</b> Nên Xuất JSON sao lưu trước.`, "Nhập & thay thế", true))) return;
      for (const c of COLS) { const list = Array.isArray(data[c]) ? data[c] : []; await store.replaceAll(c, list); DB[c] = list; }
      try { localStorage.setItem("gsql_seeded", "imported"); } catch (e) {}
      toast("Đã nhập dữ liệu"); rerender();
    } catch (e) { toast("Không nhập được: " + e.message, "err"); }
    el.value = "";
  }
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === "A") return;
  if (el.dataset.act !== "ovClose") e.preventDefault();
  fn(el, e);
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (FORM?.b && el.closest("#bkform")) return onFormInput(el, true);
  const a = el.dataset.actChange; if (a && CHANGE[a]) CHANGE[a](el, e);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (FORM?.b && el.closest("#bkform")) return onFormInput(el, false);
  if (el.dataset.actInput === "fq") { UI.f.q = el.value; const pos = el.selectionStart; rerender(); const n = $('[data-act-input="fq"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (el.id === "gq") paintSearch(el.value);
});
document.addEventListener("submit", (e) => e.preventDefault());
document.addEventListener("focusout", (e) => { const el = e.target; if (el.dataset?.money && !el.closest("#bkform") && el.tagName === "INPUT" && !el.dataset.actChange) el.value = fmtMoneyInput(parseMoney(el.value)); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#modal-root").innerHTML) closeModal();
  if (e.key === "Enter" && e.target.id === "pin") doLogin();
});

/* ================================================================
   KHỞI ĐỘNG
   ================================================================ */
async function loadAll() { for (const c of COLS) DB[c] = await store.getAll(c); }
const REMOTE_SIG = {};
function onRemote(col, list, meta) {
  if (meta) SYNC.pending[col] = !!meta.hasPendingWrites;
  const sig = JSON.stringify(list);
  const changed = sig !== REMOTE_SIG[col];
  REMOTE_SIG[col] = sig;
  paintSync();
  if (!changed) return;
  DB[col] = list;
  if (!ME) return;
  ME = person(ME.id) || null;
  if (!ME) return render();
  // Không vẽ lại khi đang mở cửa sổ hoặc đang gõ – để sau
  const a = document.activeElement;
  if ($("#modal-root").innerHTML || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $("#app").contains(a))) { PENDING_RENDER = true; return; }
  rerender();
}
document.addEventListener("focusout", () => setTimeout(() => {
  const a = document.activeElement;
  if (PENDING_RENDER && ME && !$("#modal-root").innerHTML && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) { PENDING_RENDER = false; rerender(); }
}, 50));
(async function boot() {
  $("#app").innerHTML = `<div class="login"><div class="muted">Đang tải dữ liệu…</div></div>`;
  try { await store.init(); }
  catch (e) { $("#app").innerHTML = `<div class="login"><div class="card box"><h2>Không khởi động được</h2><p>${esc(e.message)}</p><p class="small muted">Kiểm tra CONFIG (useFirebase, firebaseConfig) hoặc mạng.</p></div></div>`; return; }
  await afterAuth();
})();
async function afterAuth() {
  if (store.needsAuth()) return renderGate();
  if (CONFIG.useFirebase) {
    $("#app").innerHTML = `<div class="login"><div class="muted">Đang kiểm tra quyền truy cập…</div></div>`;
    let ok = true;
    try { ok = await store.checkAccess(); } catch (e) { ok = true; /* mất mạng: dùng dữ liệu đã lưu trên máy */ }
    if (!ok) return renderDenied();
  }
  try { await loadAll(); } catch (e) { toast("Lỗi đọc dữ liệu: " + fbMsg(e), "err"); }
  // Lần đầu chạy bản thử (không Firebase): tạo sẵn dữ liệu mẫu
  let seeded = null; try { seeded = localStorage.getItem("gsql_seeded"); } catch (e) {}
  if (!CONFIG.useFirebase && !seeded && !DB.bookings.length) { await seed(); try { localStorage.setItem("gsql_seeded", "1"); } catch (e) {} }
  await syncTasks();
  store.subscribe(onRemote);
  let sid = null; try { sid = localStorage.getItem("gsql_session"); } catch (e) {}
  ME = sid ? person(sid) || null : null;
  render();
  // nhắc việc tự cập nhật khi qua ngày
  if (!window.__tick) window.__tick = setInterval(() => { if (ME && !$("#modal-root").innerHTML) rerender(); }, 5 * 60 * 1000);
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
